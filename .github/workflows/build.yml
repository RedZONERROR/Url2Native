name: Build and Release Url2Native

on:
  workflow_dispatch:
    inputs:
      android:
        description: "Build Android APK (overrides app.config.json if not config)"
        required: false
        type: choice
        options:
          - config
          - enable
          - disable
        default: config
      android_abis:
        description: "Android APK ABI mode (split APKs per ABI, universal APK, or both)"
        required: false
        type: choice
        options:
          - split-and-universal
          - split-only
          - universal-only
        default: split-and-universal
      windows:
        description: "Build Windows installers (overrides app.config.json if not config)"
        required: false
        type: choice
        options:
          - config
          - enable
          - disable
        default: config
      macos:
        description: "Build macOS Universal bundles (overrides app.config.json if not config)"
        required: false
        type: choice
        options:
          - config
          - enable
          - disable
        default: config
      linux:
        description: "Build Linux AppImage and DEB (overrides app.config.json if not config)"
        required: false
        type: choice
        options:
          - config
          - enable
          - disable
        default: config
      app_name:
        description: "App Name (leave blank to use app.config.json)"
        required: false
        type: string
        default: ""
      package_id:
        description: "Package ID, e.g. com.example.app (leave blank to use app.config.json)"
        required: false
        type: string
        default: ""
      app_url:
        description: "Target Website URL (leave blank to use app.config.json)"
        required: false
        type: string
        default: ""
      app_version:
        description: "App Version semver, e.g. 1.0.0 (leave blank to use app.config.json)"
        required: false
        type: string
        default: ""
      app_icon_url:
        description: "Optional app icon image URL (blank = use fallback icon.png)"
        required: false
        type: string
        default: ""
      user_agent_mode:
        description: "User-Agent mode (overrides app.config.json if not config)"
        required: false
        type: choice
        options:
          - config
          - default
          - replace
          - append
        default: config
      user_agent_value:
        description: "User-Agent string (leave blank to use app.config.json)"
        required: false
        type: string
        default: ""
      navigation_enabled:
        description: "Optional Navigation Bar (overrides app.config.json if not config)"
        required: false
        type: choice
        options:
          - config
          - enable
          - disable
        default: config
      navigation_position:
        description: "Navigation bar position (overrides app.config.json if not config)"
        required: false
        type: choice
        options:
          - config
          - top
          - bottom
        default: config
      navigation_bg_color:
        description: "Navigation bar background hex color e.g. #111827 (blank = config)"
        required: false
        type: string
        default: ""
      navigation_icon_color:
        description: "Navigation bar icon/text hex color e.g. #FFFFFF (blank = config)"
        required: false
        type: string
        default: ""
      pull_to_refresh:
        description: "Pull to refresh (overrides app.config.json if not config)"
        required: false
        type: choice
        options:
          - config
          - enable
          - disable
        default: config
      smart_cache:
        description: "Smart cache / offline storage (overrides app.config.json if not config)"
        required: false
        type: choice
        options:
          - config
          - enable
          - disable
        default: config
      hardware_acceleration:
        description: "Hardware acceleration (overrides app.config.json if not config)"
        required: false
        type: choice
        options:
          - config
          - enable
          - disable
        default: config
      prevent_brightness_drop:
        description: "Keep screen awake / brightness lock (overrides app.config.json if not config)"
        required: false
        type: choice
        options:
          - config
          - enable
          - disable
        default: config
      keep_external_domains_in_app:
        description: "Keep external domains inside app (overrides app.config.json if not config)"
        required: false
        type: choice
        options:
          - config
          - enable
          - disable
        default: config
      allowed_domains:
        description: "Allowed domains comma-separated, or 'none' to clear (blank = config)"
        required: false
        type: string
        default: ""
      external_schemes:
        description: "External schemes comma-separated, or 'none' to clear (blank = config)"
        required: false
        type: string
        default: ""

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    name: Validate Config and Plan Matrix
    runs-on: ubuntu-latest
    outputs:
      app_name: ${{ steps.plan.outputs.app_name }}
      version: ${{ steps.plan.outputs.version }}
      package_id: ${{ steps.plan.outputs.package_id }}
      android: ${{ steps.plan.outputs.android }}
      android_split: ${{ steps.plan.outputs.android_split }}
      android_universal: ${{ steps.plan.outputs.android_universal }}
      has_desktop: ${{ steps.plan.outputs.has_desktop }}
      desktop_matrix: ${{ steps.plan.outputs.desktop_matrix }}
      resolved_config_b64: ${{ steps.plan.outputs.resolved_config_b64 }}
      custom_icon: ${{ steps.fetch_icon.outputs.custom_icon }}
      icon_dir: ${{ steps.plan.outputs.icon_dir }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply workflow overrides and compute build matrix
        id: plan
        env:
          INPUT_ANDROID: ${{ inputs.android || 'config' }}
          INPUT_ANDROID_ABIS: ${{ inputs.android_abis || 'split-and-universal' }}
          INPUT_WINDOWS: ${{ inputs.windows || 'config' }}
          INPUT_MACOS: ${{ inputs.macos || 'config' }}
          INPUT_LINUX: ${{ inputs.linux || 'config' }}
          INPUT_APP_NAME: ${{ inputs.app_name || '' }}
          INPUT_PACKAGE_ID: ${{ inputs.package_id || '' }}
          INPUT_APP_URL: ${{ inputs.app_url || '' }}
          INPUT_APP_VERSION: ${{ inputs.app_version || '' }}
          INPUT_USER_AGENT_MODE: ${{ inputs.user_agent_mode || 'config' }}
          INPUT_USER_AGENT_VALUE: ${{ inputs.user_agent_value || '' }}
          INPUT_NAVIGATION_ENABLED: ${{ inputs.navigation_enabled || 'config' }}
          INPUT_NAVIGATION_POSITION: ${{ inputs.navigation_position || 'config' }}
          INPUT_NAVIGATION_BG_COLOR: ${{ inputs.navigation_bg_color || '' }}
          INPUT_NAVIGATION_ICON_COLOR: ${{ inputs.navigation_icon_color || '' }}
          INPUT_PULL_TO_REFRESH: ${{ inputs.pull_to_refresh || 'config' }}
          INPUT_SMART_CACHE: ${{ inputs.smart_cache || 'config' }}
          INPUT_HARDWARE_ACCELERATION: ${{ inputs.hardware_acceleration || 'config' }}
          INPUT_PREVENT_BRIGHTNESS_DROP: ${{ inputs.prevent_brightness_drop || 'config' }}
          INPUT_KEEP_EXTERNAL_DOMAINS: ${{ inputs.keep_external_domains_in_app || 'config' }}
          INPUT_ALLOWED_DOMAINS: ${{ inputs.allowed_domains || '' }}
          INPUT_EXTERNAL_SCHEMES: ${{ inputs.external_schemes || '' }}
        run: node scripts/apply-ci-overrides.mjs --write

      - name: Fetch optional app icon from URL (or keep fallback)
        id: fetch_icon
        env:
          INPUT_APP_ICON_URL: ${{ inputs.app_icon_url || '' }}
        run: node scripts/fetch-ci-icon.mjs

      - name: Upload custom workflow icon artifact
        if: steps.fetch_icon.outputs.custom_icon == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: resolved-icon
          path: "${{ steps.fetch_icon.outputs.icon_path }}"
          retention-days: 1
          if-no-files-found: error

      - name: Validate resolved app.config.json and icon.png
        run: node scripts/configure.mjs --check-only

  build-android:
    name: Build Android APK
    needs: prepare
    if: needs.prepare.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Setup Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Apply resolved app.config.json overrides
        env:
          RESOLVED_CFG_B64: ${{ needs.prepare.outputs.resolved_config_b64 }}
        run: node scripts/apply-ci-overrides.mjs --restore

      - name: Download custom workflow icon if provided
        if: needs.prepare.outputs.custom_icon == 'true'
        uses: actions/download-artifact@v4
        with:
          name: resolved-icon
          path: "${{ needs.prepare.outputs.icon_dir }}"

      - name: Run pre-build configuration
        run: node scripts/configure.mjs

      - name: Initialize Tauri Android project
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME || env.ANDROID_SDK_ROOT }}
          NDK_HOME: ${{ env.ANDROID_HOME || env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: npx tauri android init

      - name: Apply native Android overrides
        run: node scripts/configure.mjs --android-only

      - name: Build unsigned release APKs (per-ABI and/or universal)
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME || env.ANDROID_SDK_ROOT }}
          NDK_HOME: ${{ env.ANDROID_HOME || env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
          BUILD_SPLIT: ${{ needs.prepare.outputs.android_split }}
          BUILD_UNIVERSAL: ${{ needs.prepare.outputs.android_universal }}
        run: |
          if [ "$BUILD_SPLIT" = "true" ]; then
            echo "[android] Building split APKs per ABI (arm64-v8a, armeabi-v7a, x86_64)..."
            if ! npx tauri android build --apk --split-per-abi --target aarch64 --target armv7 --target x86_64; then
              echo "[android] Split APK build failed. Extracting Kotlin/Gradle errors..."
              (cd src-tauri/gen/android && ./gradlew :app:compileReleaseKotlin --console=plain --no-daemon 2>&1 | grep -E -A 3 "^e:|Unresolved|Type mismatch|overrides nothing|FAILURE:" | head -n 60) || true
              exit 1
            fi
          fi

          if [ "$BUILD_UNIVERSAL" = "true" ]; then
            echo "[android] Building universal APK (arm64-v8a + armeabi-v7a + x86_64)..."
            if ! npx tauri android build --apk --target aarch64 --target armv7 --target x86_64; then
              echo "[android] Universal APK build failed. Extracting Kotlin/Gradle errors..."
              (cd src-tauri/gen/android && ./gradlew :app:compileUniversalReleaseKotlin --console=plain --no-daemon 2>&1 | grep -E -A 3 "^e:|Unresolved|Type mismatch|overrides nothing|FAILURE:" | head -n 60) || true
              exit 1
            fi
          fi

      - name: Align and sign APK with apksigner
        id: sign-apk
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME || env.ANDROID_SDK_ROOT }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          REPO_BOUND_KEY: "${{ github.repository_id }}:${{ github.repository }}:url2native-vault-v1"
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME}"
          BUILD_TOOLS="${SDK_DIR}/build-tools/36.0.0"
          ZIPALIGN="${BUILD_TOOLS}/zipalign"
          APKSIGNER="${BUILD_TOOLS}/apksigner"

          KEYSTORE_WORK="${{ runner.temp }}/u2n-keystore"
          OUT_DIR="${{ runner.temp }}/android-out"
          mkdir -p "$KEYSTORE_WORK" "$OUT_DIR"
          JKS_PATH="$KEYSTORE_WORK/release.jks"
          META_PATH="$KEYSTORE_WORK/metadata.json"

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "[keystore] Using ANDROID_KEYSTORE_BASE64 from repository secrets."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$JKS_PATH"
            STORE_PASS="${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD secret is required}"
            KEY_ALIAS="${ANDROID_KEY_ALIAS:-url2native}"
            KEY_PASS="${ANDROID_KEY_PASSWORD:-$STORE_PASS}"
          else
            export VAULT_PASSPHRASE
            VAULT_PASSPHRASE=$(printf '%s' "$REPO_BOUND_KEY" | openssl dgst -sha256 -hex | awk '{print $NF}')
            echo "::add-mask::$VAULT_PASSPHRASE"

            VAULT_DIR="${{ runner.temp }}/vault-repo"
            rm -rf "$VAULT_DIR"
            CREATE_NEW_VAULT=0

            if git ls-remote --exit-code --heads origin keystore-vault >/dev/null 2>&1; then
              echo "[keystore] Fetching encrypted keystore from keystore-vault branch."
              git clone --quiet --branch keystore-vault --single-branch --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$VAULT_DIR"

              VAULT_OWNER=""
              if [ -f "$VAULT_DIR/vault_owner.txt" ]; then
                VAULT_OWNER=$(tr -d '\r\n' < "$VAULT_DIR/vault_owner.txt")
              fi

              if [ -n "$VAULT_OWNER" ] && [ "$VAULT_OWNER" != "${{ github.repository }}" ]; then
                echo "[keystore] Inherited upstream keystore-vault from $VAULT_OWNER; initializing fork-owned vault for ${{ github.repository }}."
                CREATE_NEW_VAULT=1
              else
                openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -in "$VAULT_DIR/keystore.enc" -out "$JKS_PATH" -pass env:VAULT_PASSPHRASE
                openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -in "$VAULT_DIR/metadata.enc" -out "$META_PATH" -pass env:VAULT_PASSPHRASE

                STORE_PASS=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$META_PATH','utf8')).storePassword)")
                KEY_ALIAS=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$META_PATH','utf8')).keyAlias)")
                KEY_PASS=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$META_PATH','utf8')).keyPassword)")
              fi
            else
              CREATE_NEW_VAULT=1
            fi

            if [ "$CREATE_NEW_VAULT" -eq 1 ]; then
              echo "[keystore] Generating new 2048-bit RSA keystore and storing encrypted vault."
              STORE_PASS=$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | head -c 32)
              KEY_PASS="$STORE_PASS"
              KEY_ALIAS="url2native"

              SAFE_CN=$(printf '%s' "${{ needs.prepare.outputs.app_name }}" | tr -cd 'A-Za-z0-9 ._-')
              [ -z "$SAFE_CN" ] && SAFE_CN="Url2Native"

              keytool -genkeypair \
                -keystore "$JKS_PATH" \
                -alias "$KEY_ALIAS" \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -storepass "$STORE_PASS" \
                -keypass "$KEY_PASS" \
                -dname "CN=$SAFE_CN, OU=Release, O=Url2Native, L=Global, S=Global, C=US"

              node -e "require('fs').writeFileSync('$META_PATH', JSON.stringify({ storePassword: process.argv[1], keyAlias: process.argv[2], keyPassword: process.argv[3] }))" "$STORE_PASS" "$KEY_ALIAS" "$KEY_PASS"

              rm -rf "$VAULT_DIR"
              git clone --quiet --no-checkout "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$VAULT_DIR"
              cd "$VAULT_DIR"
              git checkout --orphan keystore-vault
              git rm -rf . >/dev/null 2>&1 || true

              printf '%s\n' "${{ github.repository }}" > "$VAULT_DIR/vault_owner.txt"
              openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -salt -in "$JKS_PATH" -out "$VAULT_DIR/keystore.enc" -pass env:VAULT_PASSPHRASE
              openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -salt -in "$META_PATH" -out "$VAULT_DIR/metadata.enc" -pass env:VAULT_PASSPHRASE

              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add vault_owner.txt keystore.enc metadata.enc
              git commit --quiet -m "chore: initialize encrypted Android keystore vault"
              git push --quiet --force origin keystore-vault
              cd "${{ github.workspace }}"
            fi
          fi

          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          export STORE_PASS KEY_PASS

          FOUND=0
          while IFS= read -r -d '' apk; do
            FOUND=1
            rel_dir=$(dirname "$apk")
            flavor=$(basename "$(dirname "$rel_dir")")
            base=$(basename "$apk")
            signed_name="${base/-unsigned/}"
            if [ -n "$flavor" ] && [ "$flavor" != "outputs" ] && [ "$flavor" != "apk" ] && [[ "$signed_name" != *"$flavor"* ]]; then
              signed_name="${flavor}-${signed_name}"
            fi
            aligned="$KEYSTORE_WORK/aligned-${signed_name}"
            signed="$OUT_DIR/${signed_name}"

            echo "[apksigner] Aligning and signing $base -> $signed_name"
            "$ZIPALIGN" -p -f 4 "$apk" "$aligned"
            "$APKSIGNER" sign \
              --ks "$JKS_PATH" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "env:STORE_PASS" \
              --key-pass "env:KEY_PASS" \
              --out "$signed" \
              "$aligned"
            "$APKSIGNER" verify "$signed"
          done < <(find src-tauri/gen/android/app/build/outputs/apk -type f -path "*/release/*.apk" -print0)

          if [ "$FOUND" -eq 0 ]; then
            echo "[apksigner] ERROR: No APK files produced."
            exit 1
          fi
          ls -la "$OUT_DIR"

      - name: Clean up decrypted keystore files
        if: always()
        run: |
          rm -rf "${{ runner.temp }}/u2n-keystore" "${{ runner.temp }}/vault-repo"

      - name: Upload Android APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: url2native-android
          path: "${{ runner.temp }}/android-out/*.apk"
          if-no-files-found: error

  build-desktop:
    name: Build Desktop (${{ matrix.platform }})
    needs: prepare
    if: needs.prepare.outputs.has_desktop == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.desktop_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libdbus-1-dev

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Apply resolved app.config.json overrides
        env:
          RESOLVED_CFG_B64: ${{ needs.prepare.outputs.resolved_config_b64 }}
        run: node scripts/apply-ci-overrides.mjs --restore

      - name: Download custom workflow icon if provided
        if: needs.prepare.outputs.custom_icon == 'true'
        uses: actions/download-artifact@v4
        with:
          name: resolved-icon
          path: "${{ needs.prepare.outputs.icon_dir }}"

      - name: Run pre-build configuration
        run: node scripts/configure.mjs

      - name: Build Tauri desktop bundles
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Archive macOS .app bundle
        if: matrix.platform == 'macos-universal'
        shell: bash
        run: |
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          if [ -d "$BUNDLE_DIR" ]; then
            cd "$BUNDLE_DIR"
            for app in *.app; do
              [ -d "$app" ] && zip -r "${app%.app}-macos-universal.app.zip" "$app"
            done
          fi

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: url2native-${{ matrix.platform }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.zip
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: [prepare, build-android, build-desktop]
    if: always() && (needs.build-android.result == 'success' || needs.build-desktop.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "url2native-*"
          path: artifacts

      - name: Flatten release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.prepare.outputs.version }}-r${{ github.run_number }}"
          name: "${{ needs.prepare.outputs.app_name }} v${{ needs.prepare.outputs.version }}"
          body: |
            Automated build for ${{ needs.prepare.outputs.app_name }} (${{ needs.prepare.outputs.package_id }}).
            Version: ${{ needs.prepare.outputs.version }}
          files: release-assets/*
          generate_release_notes: false
