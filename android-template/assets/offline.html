<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Url2Native App - Connection Unavailable</title>
  <style>
    :root {
      --bg-color: #FFFFFF;
      --text-color: #111827;
      --accent-color: #2563EB;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      -webkit-font-smoothing: antialiased;
    }

    .container {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(1.5rem, 5vw, 3rem);
      text-align: center;
    }

    .card {
      width: 100%;
      max-width: 28rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }

    .icon-wrap {
      width: clamp(3.5rem, 12vw, 4.5rem);
      height: clamp(3.5rem, 12vw, 4.5rem);
      border-radius: 50%;
      background-color: color-mix(in srgb, var(--accent-color) 12%, transparent);
      color: var(--accent-color);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-wrap svg {
      width: 50%;
      height: 50%;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .app-label {
      font-size: clamp(0.75rem, 2vw, 0.875rem);
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0.65;
    }

    h1 {
      font-size: clamp(1.375rem, 4vw, 1.75rem);
      font-weight: 700;
      line-height: 1.25;
    }

    p {
      font-size: clamp(0.9375rem, 2.5vw, 1rem);
      line-height: 1.6;
      opacity: 0.82;
    }

    .retry-btn {
      margin-top: 0.5rem;
      min-width: 11rem;
      min-height: 2.75rem;
      padding: 0.75rem 1.75rem;
      border: none;
      border-radius: 0.625rem;
      background-color: var(--accent-color);
      color: #FFFFFF;
      font-size: clamp(0.9375rem, 2.5vw, 1rem);
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }

    .retry-btn:hover {
      opacity: 0.92;
    }

    .retry-btn:active {
      transform: scale(0.98);
    }

    .retry-btn:disabled {
      opacity: 0.6;
      cursor: wait;
    }
  </style>
</head>
<body>
  <main class="container" role="main">
    <section class="card" aria-live="polite">
      <div class="icon-wrap" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M1 1l22 22"></path>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>
      <div class="app-label">Url2Native App</div>
      <h1>Connection Unavailable</h1>
      <p>Unable to reach the server. Please check your internet connection and try again.</p>
      <button id="retry-btn" class="retry-btn" type="button">Retry Connection</button>
    </section>
  </main>

  <script>
    (function () {
      var retryBtn = document.getElementById("retry-btn");
      var targetUrl = "https://example.com";

      retryBtn.addEventListener("click", function () {
        retryBtn.disabled = true;

        if (window.Url2NativeError && typeof window.Url2NativeError.retry === "function") {
          window.Url2NativeError.retry();
          setTimeout(function () { retryBtn.disabled = false; }, 2000);
          return;
        }

        if (window.__TAURI__ && window.__TAURI__.core && typeof window.__TAURI__.core.invoke === "function") {
          window.__TAURI__.core.invoke("retry_connection")
            .catch(function () {
              window.location.replace(targetUrl);
            })
            .finally(function () {
              setTimeout(function () { retryBtn.disabled = false; }, 1500);
            });
          return;
        }

        window.location.replace(targetUrl);
      });
    })();
  </script>
</body>
</html>
